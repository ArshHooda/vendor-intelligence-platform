name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "README.md"
      - ".github/workflows/deploy-dashboard-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dashboard dependency
        run: python -m pip install "openpyxl>=3.1,<4"

      - name: Build vendor activity data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SOURCE_BUCKET: ap-source-files
        run: python scripts/build_dashboard_data.py

      - name: Verify public artifact and frontend security
        run: python scripts/security_audit.py --data dist/data/vendor_activity.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Probe deployed site for accidental exposure
        run: python scripts/passive_web_audit.py "${{ steps.deployment.outputs.page_url }}"
