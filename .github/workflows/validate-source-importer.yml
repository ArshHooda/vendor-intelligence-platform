name: Validate source importer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/validate-source-importer.yml
      - scripts/import_source_files.py
      - tests/**
      - requirements.txt
      - sql/staging/**

permissions:
  contents: read

concurrency:
  group: validate-source-importer
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test importer
        run: python -m unittest discover -s tests -v

      - name: Validate live schema and source workbooks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PGHOST: ${{ secrets.SUPABASE_DB_HOST }}
          PGUSER: ${{ secrets.SUPABASE_DB_USER }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGPORT: "5432"
          PGDATABASE: postgres
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "20"
          SOURCE_BUCKET: ap-source-files
          SOURCE_FILES: Bills972.xlsx,4DMTVendorListingResults775.xlsx
        run: python scripts/import_source_files.py --preflight-only
