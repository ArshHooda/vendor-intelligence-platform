name: Import source files

on:
  workflow_dispatch:
    inputs:
      files:
        description: Comma-separated object names in the ap-source-files bucket
        required: true
        default: Bills972.xlsx,4DMTVendorListingResults775.xlsx

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Import Excel files into staging
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PGHOST: ${{ secrets.SUPABASE_DB_HOST }}
          PGUSER: ${{ secrets.SUPABASE_DB_USER }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGPORT: "5432"
          PGDATABASE: postgres
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "20"
          SOURCE_BUCKET: ap-source-files
          SOURCE_FILES: ${{ inputs.files }}
        run: python scripts/import_source_files.py
