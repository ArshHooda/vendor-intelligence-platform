name: Keep Supabase active

on:
  schedule:
    # Run away from the start of the hour, when scheduled Actions are busiest.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-supabase-active
  cancel-in-progress: true

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install database driver
        run: python -m pip install "psycopg[binary]>=3.2,<4"

      - name: Run read-only database checks
        env:
          PGHOST: ${{ secrets.SUPABASE_DB_HOST }}
          PGUSER: ${{ secrets.SUPABASE_DB_USER }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGPORT: "5432"
          PGDATABASE: postgres
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "20"
        run: |
          python - <<'PY'
          import os
          import sys

          import psycopg

          required = ["PGHOST", "PGUSER", "PGPASSWORD"]
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              sys.exit("Missing GitHub secrets: " + ", ".join(missing))

          checks = [
              ("source files", "SELECT count(*) FROM staging.source_files"),
              ("source rows", "SELECT count(*) FROM staging.source_rows"),
              ("pipeline runs", "SELECT count(*) FROM quality.pipeline_runs"),
          ]

          try:
              with psycopg.connect() as connection:
                  connection.execute("SET TRANSACTION READ ONLY")
                  connection.execute("SET LOCAL statement_timeout = '15s'")
                  for label, query in checks:
                      count = connection.execute(query).fetchone()[0]
                      print(f"PASS: {label}: {count}")
          except psycopg.Error as exc:
              sys.exit(
                  f"FAIL: Supabase health check: {type(exc).__name__}; "
                  f"SQLSTATE={exc.sqlstate or 'unavailable'}"
              )

          print("Supabase read-only health check completed.")
          PY
